name: 商品排程上下架

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch: {}

# 只需要讀取程式碼，不需要寫入儲存庫的權限
permissions:
  contents: read

jobs:
  run-scheduler:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scripts/product-scheduler
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'

      - name: Install dependencies
        # 依 package-lock.json 安裝固定版本（npm ci），而且不執行套件的安裝腳本（--ignore-scripts）。
        # 這個流程帶著資料庫最高權限的金鑰；以前 npm install 每次都抓最新版，
        # 萬一某個相依套件在 npm 上被植入惡意版本，下一次執行就會拿到這把金鑰
        run: npm ci --ignore-scripts

      - name: Run scheduler
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: npm start
