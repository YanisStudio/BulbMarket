name: 會員資料同步

on:
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch: {}

jobs:
  run-sync:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scripts/reconcile-user-profiles
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: 執行會員資料同步
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node run.mjs --apply
