<link rel="icon" type="image/png" sizes="16x16" href="/images/logo.png">
<link rel="apple-touch-icon" sizes="180x180" href="/images/logo.png">
<link rel="shortcut icon" href="/images/logo.png">

    <link rel="stylesheet" href="/css/admin-common.css">

    <!-- 保持原版的 Firebase 初始化方式以確保兼容性 -->
    <script src="/js/firebase-config.js"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { 
          getAuth, 
          onAuthStateChanged
        } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-auth.js";
        import { 
          getFirestore,
          collection,
          getDocs,
          query,
          orderBy,
          where,
          limit
        } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";
      
        const firebaseConfig = window.FIREBASE_CONFIG;
        
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        
        window.firebaseServices = {
          auth: auth,
          db: db,
          getAuth,
          onAuthStateChanged,
          collection,
          getDocs,
          query,
          orderBy,
          where,
          limit
        };
    </script>
</head>

                    <li><a href="/admin/products.html">商品管理</a></li>
                    <li><a href="/admin/users.html">會員管理</a></li>
                    <li><a href="/admin/messages.html">訊息管理</a></li>
                    <li><a href="/admin/shipping.html">運費設定</a></li>
                    <li><a href="/admin/bulletin.html">布告欄管理</a></li>
                </ul>
            </nav>
            
            <div class="header-right">
                <div class="user-profile" id="user-profile">

                        <i class="fas fa-chevron-down"></i>
                    </div>
                    <div class="user-menu" id="user-menu">

                    </div>
                </div>
            </div>
        </div>
    </header>
    
    <div class="menu-overlay" id="menu-overlay"></div>
    
    <main>

            <h1 class="admin-title">管理系統</h1>
            
            <div class="admin-dashboard">

                    </div>
                    
                    <div class="stat-card">
                        <div class="stat-icon">

                        <div class="stat-info">

                    </div>
                    
                    <div class="stat-card">
                        <div class="stat-icon">

                <div class="admin-navigation" style="margin-top: 40px;">

    <script src="/js/member.js"></script>

    <style>
        /* 改善操作按鈕的視覺效果 */
.table-action-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    text-decoration: none;
    font-size: 14px;
    transition: all 0.3s ease;
    border: 1px solid #e1e5e9;
    background-color: #f8f9fa;
    color: #495057;
}

.table-view-btn {
    background-color: #6c757d;
    color: white;
    border-color: #6c757d;
}

.table-view-btn:hover {
    background-color: #4caf50; /* 自然綠色，符合植物主題 */
    border-color: #4caf50;
    transform: translateY(-2px);
    box-shadow: 0 4px 12px rgba(76, 175, 80, 0.3);
}

.table-view-btn:active {
    transform: translateY(0);
}
    </style>
    
    <script>
    // 使用 admin-common.js 的管理員檢查函數
    function isAdmin(email) {
        // 如果 AdminCommon 還沒載入，回傳 false
        if (!window.AdminCommon || !window.AdminCommon.isAdmin) {
            return false;
        }
        return window.AdminCommon.isAdmin(email);
    }

    document.addEventListener('DOMContentLoaded', function() {
        // 等待 AdminCommon 載入完成
        const waitForAdminCommon = function() {
            console.log('檢查 AdminCommon:', !!window.AdminCommon);
            if (window.AdminCommon) {
                console.log('AdminCommon 已載入');
                console.log('AdminCommon 方法:', Object.keys(window.AdminCommon));
                console.log('isAdmin 函數:', typeof window.AdminCommon.isAdmin);
                checkAdminAccess();
            } else {
                console.log('等待 AdminCommon 載入...');
                setTimeout(waitForAdminCommon, 100);
            }
        };
        
        // 權限檢查
        const checkAdminAccess = function() {
            if (window.firebaseServices && window.firebaseServices.auth) {
                window.firebaseServices.onAuthStateChanged(window.firebaseServices.auth, function(user) {
                    console.log('當前用戶:', user ? user.email : '未登入');
                    console.log('管理員檢查結果:', user ? isAdmin(user.email) : false);
                    
                    if (!user || !isAdmin(user.email)) {
                        console.log('非管理員訪問，重定向回首頁');
                        setTimeout(() => {
                            window.location.href = '/index.html';
                        }, 2000);
                    } else {
                        console.log('管理員已登入');
                        const usernameDisplay = document.getElementById('username-display');
                        if (usernameDisplay) {
                            usernameDisplay.textContent = '管理員';
                        }
                        loadAdminData();
                    }
                });
            } else {
                console.log('Firebase 服務未就緒，重試中...');
                setTimeout(checkAdminAccess, 1000);
            }
        };
        
        const loadAdminData = function() {
            fetchStatistics();
            fetchRecentOrders();
        };

        // 獲取統計數據
        const fetchStatistics = async function() {
            try {
                const db = window.firebaseServices.db;
                const collection = window.firebaseServices.collection;
                const query = window.firebaseServices.query;
                const getDocs = window.firebaseServices.getDocs;
                const where = window.firebaseServices.where;

                const pendingOrdersQuery = query(
                    collection(db, "orders"),
                    where("status", "==", "pending")
                );
                const pendingOrdersSnapshot = await getDocs(pendingOrdersQuery);
                document.getElementById('pending-orders').textContent = pendingOrdersSnapshot.size;

                const completedOrdersQuery = query(
                    collection(db, "orders"),
                    where("status", "==", "completed")
                );
                const completedOrdersSnapshot = await getDocs(completedOrdersQuery);
                document.getElementById('completed-orders').textContent = completedOrdersSnapshot.size;

                const usersSnapshot = await getDocs(collection(db, "users"));
                document.getElementById('total-users').textContent = usersSnapshot.size;

                const productsSnapshot = await getDocs(collection(db, "products"));
                document.getElementById('total-products').textContent = productsSnapshot.size;

            } catch (error) {
                console.error("獲取統計數據失敗:", error);
                document.getElementById('pending-orders').textContent = "--";
                document.getElementById('completed-orders').textContent = "--";
                document.getElementById('total-users').textContent = "--";
                document.getElementById('total-products').textContent = "--";
            }
        };

        // 獲取最近訂單
        const fetchRecentOrders = async function() {
            try {
                const db = window.firebaseServices.db;
                const collection = window.firebaseServices.collection;
                const query = window.firebaseServices.query;
                const getDocs = window.firebaseServices.getDocs;
                const orderBy = window.firebaseServices.orderBy;
                const limit = window.firebaseServices.limit;

                const recentOrdersQuery = query(
                    collection(db, "orders"),
                    orderBy("orderDate", "desc"),
                    limit(5)
                );
                const ordersSnapshot = await getDocs(recentOrdersQuery);
                
                if (ordersSnapshot.empty) {
                    document.getElementById('recent-orders-list').innerHTML = `
                        <tr>
                            <td colspan="6">暫無訂單數據</td>
                        </tr>
                    `;
                    return;
                }

                let ordersHTML = '';
                ordersSnapshot.forEach(doc => {
                    const order = doc.data();
                    const orderId = doc.id;
                    
                    let orderDate = '未知日期';
                    if (order.orderDate && order.orderDate.toDate) {
                        const date = order.orderDate.toDate();
                        orderDate = date.toLocaleDateString('zh-TW');
                    }
                    
                    let statusClass = 'pending';
                    let statusText = '待處理';
                    
                    switch(order.status) {
                        case 'confirmed':
                            statusClass = 'confirmed';
                            statusText = '已確認';
                            break;
                        case 'shipped':
                            statusClass = 'shipped';
                            statusText = '已出貨';
                            break;
                        case 'completed':
                            statusClass = 'completed';
                            statusText = '已完成';
                            break;
                        case 'cancelled':
                            statusClass = 'cancelled';
                            statusText = '已取消';
                            break;
                    }
                    
                    ordersHTML += `
                        <tr>
                            <td>${escapeHtml(order.orderNumber) || '無訂單編號'}</td>
                            <td>${escapeHtml(order.customer?.name) || '未知'}</td>
                            <td>${orderDate}</td>
                            <td>${order.total || 0}</td>
                            <td><span class="status-badge ${statusClass}">${statusText}</span></td>
                            <td>
                                <a href="/admin/orders.html?id=${orderId}" class="table-action-btn table-view-btn">
    <i class="fas fa-eye"></i>
                            </td>
                        </tr>
                    `;
                });
                
                document.getElementById('recent-orders-list').innerHTML = ordersHTML;
            } catch (error) {
                console.error("獲取最近訂單失敗:", error);
                document.getElementById('recent-orders-list').innerHTML = `
                    <tr>
                        <td colspan="6">獲取訂單數據失敗，請重試</td>
                    </tr>
                `;
            }
        };
        // 開始初始化流程
        waitForAdminCommon();
    });
    </script>
</body>
