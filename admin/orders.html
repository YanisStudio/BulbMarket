<link rel="icon" type="image/png" sizes="16x16" href="/images/logo.png">

    <!-- 引入 SheetJS 用於 Excel 功能 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    
    <!-- 引入 Firebase SDK -->
    <script src="/js/firebase-config.js"></script>
    <script type="module">
        // 導入Firebase所需模組
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { 
            getAuth, 
            onAuthStateChanged,
            signOut
        } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-auth.js";
        import { 
            getFirestore,
            collection,
            doc,
            getDocs,
            getDoc,
            updateDoc,
            deleteDoc,
            query,
            orderBy,
            where
        } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";
        
        // Firebase配置 - 統一使用與其他頁面相同的配置
        const firebaseConfig = window.FIREBASE_CONFIG;
        
        // 初始化Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        
        // 將Firebase服務變數暴露給全局使用
        window.firebaseServices = {
            auth: auth,
            db: db,
            getAuth,
            onAuthStateChanged,
            signOut,
            collection,
            doc,
            getDocs,
            getDoc,
            updateDoc,
            deleteDoc,
            query,
            orderBy,
            where
        };
    </script>
</head>

    <!-- Excel匯出設定彈窗 - 使用 admin-common.css 的樣式 -->

        <div class="confirm-dialog-content">
            <h3>📊 匯出詳細報表設定</h3>
            <form id="excel-export-form">
                <div class="form-group">
                    <label>匯出範圍:</label>
                    <div class="radio-group">
                        <label><input type="radio" name="export-range" value="all" checked> 全部訂單</label>
                        <label><input type="radio" name="export-range" value="confirmed"> 僅已確認訂單</label>
                        <label><input type="radio" name="export-range" value="shipped"> 僅已出貨訂單</label>
                        <label><input type="radio" name="export-range" value="completed"> 僅已完成訂單</label>
                    </div>
                </div>
                
                <div class="form-group">
                    <label>商品分類篩選:</label>
                    <div class="checkbox-group">
                        <label><input type="checkbox" name="category" value="bulbs" checked> 球根花卉</label>
                        <label><input type="checkbox" name="category" value="plants" checked> 花卉盆栽</label>
                        <label><input type="checkbox" name="category" value="seeds" checked> 種子</label>
                        <label><input type="checkbox" name="category" value="other" checked> 其他</label>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="date-range">日期範圍 (可選):</label>
                    <div class="date-range">
                        <input type="date" id="start-date" placeholder="開始日期">
                        <span>至</span>
                        <input type="date" id="end-date" placeholder="結束日期">
                    </div>
                </div>
                
                <div class="form-group">
                    <label>報表類型:</label>
                    <div class="checkbox-group">
                        <label><input type="checkbox" name="report-type" value="detailed" checked> 詳細訂單明細</label>
                        <label><input type="checkbox" name="report-type" value="customer" checked> 客戶購買統計</label>
                        <label><input type="checkbox" name="report-type" value="product" checked> 商品銷售統計</label>
                        <label><input type="checkbox" name="report-type" value="category" checked> 分類統計</label>
                        <label><input type="checkbox" name="report-type" value="daily" checked> 每日銷售統計</label>
                    </div>
                </div>
                
                <div class="confirm-dialog-buttons">
                    <button type="submit" class="btn btn-success">
                        <i class="fas fa-download"></i> 開始匯出
                    </button>
                    <button type="button" class="btn btn-secondary" id="cancel-export">取消</button>
                </div>
            </form>
        </div>
    </div>

        /* Excel匯出設定彈窗：內容比一般確認彈窗多很多，
           所以不沿用 .confirm-dialog 給刪除確認用的紅色警示標頭跟 450px 窄版寬度，
           改成這個彈窗專屬的樣式，只鎖定 #excel-export-modal 底下，不影響其他頁面共用的確認彈窗 */
        #excel-export-modal .confirm-dialog-content {
            max-width: 640px;
            max-height: 85vh;
            display: flex;
            flex-direction: column;
        }

        #excel-export-modal h3 {
            background: linear-gradient(135deg, #4caf50, #43a047);
            flex-shrink: 0;
        }

        #excel-export-modal #excel-export-form {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            padding: 24px 30px 0;
        }

        #excel-export-modal .form-group {
            background-color: #f9f9f9;
            border: 1px solid #eee;
            border-radius: 8px;
            padding: 14px 16px;
            margin-bottom: 14px;
        }

        #excel-export-modal .form-group:last-of-type {
            margin-bottom: 0;
        }

        #excel-export-modal .form-group label:first-child {
            display: block;
            margin-bottom: 10px;
            font-weight: 600;
            color: #333;
        }

        #excel-export-modal .radio-group,
        #excel-export-modal .checkbox-group {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 10px 16px;
        }

        #excel-export-modal .radio-group label,
        #excel-export-modal .checkbox-group label {
            display: flex;
            align-items: center;
            font-weight: normal;
            margin-bottom: 0;
            cursor: pointer;
            white-space: nowrap;
        }

        #excel-export-modal .radio-group input,
        #excel-export-modal .checkbox-group input {
            /* admin-common.css 的 .form-group input 把寬度設成 100%（給文字欄位用的），
               勾選框/單選鈕繼承到會被撐成整欄寬，這裡要蓋回原本的寬度 */
            width: auto;
            flex: 0 0 auto;
            margin-right: 8px;
        }

        #excel-export-modal .date-range {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        #excel-export-modal .date-range input {
            flex: 1;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }

        #excel-export-modal .confirm-dialog-buttons {
            position: sticky;
            bottom: 0;
            background: #fff;
            padding: 16px 0 24px;
            margin-top: 8px;
            border-top: 1px solid #eee;
        }

        /* 訂單編輯功能樣式 */
        .order-detail-actions {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }

        .edit-order-form {
            background-color: #f8f9fa;
            border: 2px solid #007bff;
            border-radius: 8px;
            padding: 20px;
            margin: 15px 0;
            box-shadow: 0 2px 8px rgba(0, 123, 255, 0.1);
        }

        .edit-order-form h4 {
            color: #007bff;
            margin-top: 0;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #e9ecef;
        }

        .edit-order-form .form-row {
            display: flex;
            gap: 15px;
            margin-bottom: 15px;
        }

        .edit-order-form .form-group {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .edit-order-form label {
            margin-bottom: 5px;
            font-weight: 600;
            color: #333;
            font-size: 14px;
        }

        .edit-order-form select {
            padding: 10px 12px;
            border: 1px solid #ced4da;
            border-radius: 6px;
            font-size: 14px;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
            background-color: #fff;
        }

        .edit-order-form input:focus,
        .edit-order-form select:focus {
            outline: none;
            border-color: #007bff;
            box-shadow: 0 0 0 3px rgba(0, 123, 255, 0.1);
        }

        .edit-order-form input:required {
            background-color: #fff9f9;
        }

        .edit-order-form input[type="number"] {
            text-align: right;
        }

        .edit-form-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-top: 25px;
            padding-top: 15px;
            border-top: 1px solid #e9ecef;
        }

        .edit-form-actions .btn {
            min-width: 120px;
            padding: 10px 20px;
            font-weight: 600;
        }

        .edit-form-actions .btn-success {
            background: linear-gradient(45deg, #28a745, #20c997);
            border: none;
            box-shadow: 0 2px 8px rgba(40, 167, 69, 0.3);
            transition: all 0.3s ease;
        }

        .edit-form-actions .btn-success:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(40, 167, 69, 0.4);
        }

        .edit-form-actions .btn-success:disabled {
            opacity: 0.7;
            transform: none;
            box-shadow: 0 2px 8px rgba(40, 167, 69, 0.3);
        }

        .edit-form-actions .btn-secondary {
            background-color: #6c757d;
            border-color: #6c757d;
            transition: all 0.3s ease;
        }

        .edit-form-actions .btn-secondary:hover {
            background-color: #5a6268;
            border-color: #545b62;
            transform: translateY(-1px);
        }

        #edit-order-btn {
            transition: all 0.3s ease;
        }

        #edit-order-btn.btn-secondary {
            background-color: #6c757d;
            border-color: #6c757d;
        }

        #edit-order-btn.btn-secondary:hover {
            background-color: #5a6268;
            border-color: #545b62;
        }

    </style>
    
    <script>
        // 使用 admin-common.js 的管理員檢查函數
        function isAdmin(email) {
            // 如果 AdminCommon 還沒載入，回傳 false
            if (!window.AdminCommon || !window.AdminCommon.isAdmin) {
                return false;
            }
            return window.AdminCommon.isAdmin(email);
        }

        document.addEventListener('DOMContentLoaded', function() {
            // 等待 AdminCommon 載入完成
            const waitForAdminCommon = function() {
                if (window.AdminCommon) {
                    console.log('AdminCommon 已載入');
                    initializeOrderPanel();
                } else {
                    console.log('等待 AdminCommon 載入...');
                    setTimeout(waitForAdminCommon, 100);
                }
            };
            
            function initializeOrderPanel() {
                const ordersSection = document.getElementById('orders-section');
                const unauthorizedSection = document.getElementById('unauthorized-section');
                const orderList = document.getElementById('order-list');
                const orderDetail = document.getElementById('order-detail');
                const refreshBtn = document.getElementById('refresh-btn');
                const statusFilter = document.getElementById('status-filter');
                const searchInput = document.getElementById('search-order');
                const searchBtn = document.getElementById('search-btn');
                const logoutBtn = document.getElementById('logout-btn');
                const usernameDisplay = document.getElementById('username-display');
                const currentUserEmail = document.getElementById('current-user-email');
                const userDropdownBtn = document.getElementById('user-dropdown-btn');
                const userMenu = document.getElementById('user-menu');
                const exportExcelBtn = document.getElementById('export-excel-btn');
                const excelExportModal = document.getElementById('excel-export-modal');
                const excelExportForm = document.getElementById('excel-export-form');
                const cancelExportBtn = document.getElementById('cancel-export');
                
                // 檢查當前登入狀態
                window.firebaseServices.onAuthStateChanged(window.firebaseServices.auth, async user => {
                    if (user) {
                        const userEmail = user.email.toLowerCase();
                        
                        if (isAdmin(userEmail)) {
                            ordersSection.style.display = 'block';
                            unauthorizedSection.style.display = 'none';
                            if (usernameDisplay) {
                                usernameDisplay.textContent = '管理員';
                            }
                            loadOrders();
                        } else {
                            ordersSection.style.display = 'none';
                            unauthorizedSection.style.display = 'block';
                            if (currentUserEmail) {
                                currentUserEmail.textContent = `當前登入帳號: ${user.email}`;
                            }
                        }
                    } else {
                        ordersSection.style.display = 'none';
                        unauthorizedSection.style.display = 'block';
                        if (currentUserEmail) {
                            currentUserEmail.textContent = '您尚未登入';
                        }
                    }
                });

                // Excel匯出功能 - 使用 admin-common.css 的彈窗樣式
                if (exportExcelBtn) {
                    exportExcelBtn.addEventListener('click', function() {
                        excelExportModal.classList.add('active');
                    });
                }
                
                if (cancelExportBtn) {
                    cancelExportBtn.addEventListener('click', function() {
                        excelExportModal.classList.remove('active');
                    });
                }
                
                // Excel匯出表單提交
                if (excelExportForm) {
                    excelExportForm.addEventListener('submit', function(e) {
                        e.preventDefault();
                        generateExcelReport();
                    });
                }
                
                // 點擊模態框外部關閉
                window.addEventListener('click', function(e) {
                    if (e.target === excelExportModal) {
                        excelExportModal.classList.remove('active');
                    }
                });
                
                // 刷新按鈕
                if (refreshBtn) {
                    refreshBtn.addEventListener('click', function() {
                        loadOrders();
                    });
                }
                
                // 狀態篩選
                if (statusFilter) {
                    statusFilter.addEventListener('change', function() {
                        loadOrders();
                    });
                }
                
                // 搜尋功能
                if (searchBtn) {
                    searchBtn.addEventListener('click', function() {
                        loadOrders();
                    });
                }
                
                if (searchInput) {
                    searchInput.addEventListener('keypress', function(e) {
                        if (e.key === 'Enter') {
                            loadOrders();
                        }
                    });
                }
                
                // 簡化版Excel匯出功能
                async function generateExcelReport() {
                    try {
                        window.AdminCommon.showToast('正在生成Excel報表...', 'info');
                        
                        const exportRange = document.querySelector('input[name="export-range"]:checked').value;
                        
                        const ordersCollectionRef = window.firebaseServices.collection(window.firebaseServices.db, 'orders');
                        let q;
                        
                        if (exportRange === 'all') {
                            q = window.firebaseServices.query(ordersCollectionRef, 
                                window.firebaseServices.orderBy('orderDate', 'desc'));
                        } else {
                            q = window.firebaseServices.query(ordersCollectionRef, 
                                window.firebaseServices.where('status', '==', exportRange));
                        }
                        
                        const querySnapshot = await window.firebaseServices.getDocs(q);
                        
                        if (querySnapshot.empty) {
                            window.AdminCommon.showToast('沒有找到符合條件的訂單', 'warning');
                            excelExportModal.classList.remove('active');
                            return;
                        }
                        
                        const workbook = XLSX.utils.book_new();
                        const detailData = [];
                        detailData.push([
                            '訂單日期', '訂單編號', '客戶姓名', '客戶電話', '客戶Email',
                            '配送方式', '地址/門市', '商品名稱', '數量', '單價', '小計', '訂單狀態'
                        ]);
                        
                        querySnapshot.forEach((doc) => {
                            const orderData = doc.data();
                            
                            let orderDate = '未知日期';
                            if (orderData.orderDate && orderData.orderDate.toDate) {
                                orderDate = orderData.orderDate.toDate().toLocaleDateString('zh-TW');
                            }
                            
                            const orderNumber = orderData.orderNumber || doc.id;
                            const customerName = orderData.customer?.name || '未知客戶';
                            const customerPhone = orderData.customer?.phone || '';
                            const customerEmail = orderData.customer?.email || '';
                            const orderStatus = getStatusText(orderData.status || 'pending');
                            
                            if (orderData.items && orderData.items.length > 0) {
                                orderData.items.forEach(item => {
                                    const shippingMethod = orderData.shipping === 'home' ? '宅配到府' : '超商取貨';
                                    const customerAddress = orderData.customer?.address || '未知地址';
                                    
                                    detailData.push([
                                        orderDate,
                                        orderNumber,
                                        customerName,
                                        customerPhone,
                                        customerEmail,
                                        shippingMethod,
                                        customerAddress,
                                        item.name || '未知商品',
                                        item.quantity,
                                        item.price,
                                        item.price * item.quantity,
                                        orderStatus
                                    ]);
                                });
                            }
                        });
                        
                        const detailSheet = XLSX.utils.aoa_to_sheet(detailData);
                        detailSheet['!cols'] = [
                            { width: 15 }, { width: 20 }, { width: 15 }, { width: 15 }, { width: 25 },
                            { width: 12 }, { width: 30 }, { width: 30 }, { width: 8 }, { width: 10 }, { width: 10 }, { width: 12 }
                        ];
                        
                        XLSX.utils.book_append_sheet(workbook, detailSheet, '訂單明細');
                        
                        const today = new Date().toISOString().split('T')[0];
                        const fileName = `球根花卉團購_訂單報表_${today}.xlsx`;
                        XLSX.writeFile(workbook, fileName);
                        
                        window.AdminCommon.showToast('Excel報表已成功生成並下載！', 'success');
                        excelExportModal.classList.remove('active');
                        
                    } catch (error) {
                        console.error('生成Excel報表時出錯:', error);
                        window.AdminCommon.showToast('生成Excel報表時出錯，請稍後再試', 'error');
                    }
                }
                
                function getStatusText(status) {
                    const statusMap = {
                        'pending': '待處理',
                        'confirmed': '已確認',
                        'shipped': '已出貨',
                        'completed': '已完成',
                        'cancelled': '已取消'
                    };
                    return statusMap[status] || '未知狀態';
                }
                
                // 加載訂單
                function loadOrders() {
                    orderList.innerHTML = '<p class="loading-message">載入訂單中...</p>';
                    orderDetail.innerHTML = '<div class="no-order-selected"><p>請選擇一個訂單查看詳情</p></div>';
                    
                    const ordersCollectionRef = window.firebaseServices.collection(window.firebaseServices.db, 'orders');
                    
                    try {
                        let q;
                        const statusValue = statusFilter.value;
                        
                        if (statusValue === 'all') {
                            q = window.firebaseServices.query(ordersCollectionRef, 
                                window.firebaseServices.orderBy('orderDate', 'desc'));
                        } else {
                            q = window.firebaseServices.query(ordersCollectionRef, 
                                window.firebaseServices.where('status', '==', statusValue));
                        }
                        
                        window.firebaseServices.getDocs(q)
                            .then((querySnapshot) => {
                                if (querySnapshot.empty) {
                                    orderList.innerHTML = '<p class="no-orders">沒有找到訂單</p>';
                                    return;
                                }
                                
                                const searchTerm = searchInput.value.trim().toLowerCase();
                                let filteredOrders = [];
                                
                                querySnapshot.forEach((doc) => {
                                    const orderData = doc.data();
                                    orderData.id = doc.id;
                                    
                                    if (searchTerm) {
                                        const orderNumber = orderData.orderNumber?.toLowerCase() || '';
                                        const customerName = orderData.customer?.name?.toLowerCase() || '';
                                        const customerPhone = orderData.customer?.phone?.toLowerCase() || '';
                                        const customerEmail = orderData.customer?.email?.toLowerCase() || '';
                                        
                                        if (orderNumber.includes(searchTerm) || 
                                            customerName.includes(searchTerm) || 
                                            customerPhone.includes(searchTerm) || 
                                            customerEmail.includes(searchTerm)) {
                                            filteredOrders.push(orderData);
                                        }
                                    } else {
                                        filteredOrders.push(orderData);
                                    }
                                });
                                
                                if (filteredOrders.length === 0) {
                                    orderList.innerHTML = '<p class="no-orders">沒有找到符合條件的訂單</p>';
                                    return;
                                }
                                
                                if (statusValue !== 'all') {
                                    filteredOrders.sort((a, b) => {
                                        const dateA = a.orderDate && a.orderDate.toDate ? a.orderDate.toDate() : new Date(a.orderDate || 0);
                                        const dateB = b.orderDate && b.orderDate.toDate ? b.orderDate.toDate() : new Date(b.orderDate || 0);
                                        return dateB - dateA;
                                    });
                                }
                                
                                let ordersHTML = '';
                                
                                filteredOrders.forEach(order => {
                                    const orderDate = window.AdminCommon.formatDate(order.orderDate, 'full');
                                    
                                    let statusClass = '';
                                    let statusText = '';
                                    
                                    switch(order.status) {
                                        case 'pending':
                                            statusClass = 'pending';
                                            statusText = '待處理';
                                            break;
                                        case 'confirmed':
                                            statusClass = 'confirmed';
                                            statusText = '已確認';
                                            break;
                                        case 'shipped':
                                            statusClass = 'shipped';
                                            statusText = '已出貨';
                                            break;
                                        case 'completed':
                                            statusClass = 'completed';
                                            statusText = '已完成';
                                            break;
                                        case 'cancelled':
                                            statusClass = 'cancelled';
                                            statusText = '已取消';
                                            break;
                                        default:
                                            statusClass = 'pending';
                                            statusText = '待處理';
                                    }
                                    
                                    ordersHTML += `
                                        <div class="order-item" data-id="${order.id}">
                                            <div class="order-item-header">
                                                <span class="order-number">${escapeHtml(order.orderNumber) || '無訂單編號'}</span>
                                                <span class="status-badge ${statusClass}">${statusText}</span>
                                            </div>
                                            <div class="order-item-body">
                                                <p><strong>客戶:</strong> ${escapeHtml(order.customer?.name) || '未知'}</p>
                                                <p><strong>金額:</strong> ${order.total || 0}</p>
                                                <p><strong>日期:</strong> ${orderDate}</p>
                                            </div>
                                        </div>
                                    `;
                                });
                                
                                orderList.innerHTML = ordersHTML;
                                
                                document.querySelectorAll('.order-item').forEach(item => {
                                    item.addEventListener('click', function() {
                                        document.querySelectorAll('.order-item').forEach(order => {
                                            order.classList.remove('selected');
                                        });
                                        
                                        this.classList.add('selected');
                                        
                                        const orderId = this.getAttribute('data-id');
                                        showOrderDetail(orderId);
                                    });
                                });
                            })
                            .catch((error) => {
                                console.error('獲取訂單時出錯:', error);
                                orderList.innerHTML = '<p class="error-message">獲取訂單時出錯，請稍後再試</p>';
                            });
                    } catch (error) {
                        console.error('建立查詢時出錯:', error);
                        orderList.innerHTML = '<p class="error-message">處理訂單查詢時出錯，請稍後再試</p>';
                    }
                }
                
                // 顯示訂單詳情
                function showOrderDetail(orderId) {
                    orderDetail.innerHTML = '<p class="loading-message">載入訂單詳情中...</p>';
                    
                    const orderDocRef = window.firebaseServices.doc(window.firebaseServices.db, 'orders', orderId);
                    
                    async function getProductImages() {
                        try {
                            const productsCollection = window.firebaseServices.collection(window.firebaseServices.db, "products");
                            const productsSnapshot = await window.firebaseServices.getDocs(productsCollection);
                            
                            const productImages = {};
                            productsSnapshot.forEach(doc => {
                                const data = doc.data();
                                productImages[doc.id] = data.imageUrl || '/images/placeholder.jpg';
                            });
                            
                            return productImages;
                        } catch (error) {
                            console.error('獲取產品圖片失敗:', error);
                            return {};
                        }
                    }
                    
                    window.firebaseServices.getDoc(orderDocRef)
                        .then(async (docSnap) => {
                            if (docSnap.exists()) {
                                const order = docSnap.data();
                                const productImages = await getProductImages();
                                
                                const orderDate = window.AdminCommon.formatDate(order.orderDate, 'full');
                                
                                let itemsHTML = '';
                                if (order.items && order.items.length > 0) {
                                    itemsHTML = '<div class="order-items-list">';
                                    order.items.forEach(item => {
                                        const imageUrl = productImages[item.id] || item.image || '/images/placeholder.jpg';
                                        
                                        itemsHTML += `
                                            <div class="order-item-detail">
                                                <div class="item-image">
                                                    <img src="${imageUrl}" alt="${escapeHtml(item.name)}" onerror="this.onerror=null; this.src='/images/placeholder.jpg';">
                                                </div>
                                                <div class="item-info">
                                                    <h4>${escapeHtml(item.name)}</h4>
                                                    <p>${item.price} x ${item.quantity} = ${item.price * item.quantity}</p>
                                                </div>
                                            </div>
                                        `;
                                    });
                                    itemsHTML += '</div>';
                                } else {
                                    itemsHTML = '<p>沒有商品信息</p>';
                                }
                                
                                let notesHTML = '';
                                if (order.notes && order.notes.trim() !== '') {
                                    notesHTML = `
                                        <div class="order-notes">
                                            <h4>客戶備註:</h4>
                                            <p>${escapeHtml(order.notes).replace(/\n/g, '<br>')}</p>
                                        </div>
                                    `;
                                }
                                
                                const statusOptions = [
                                    { value: 'pending', text: '待處理' },
                                    { value: 'confirmed', text: '已確認' },
                                    { value: 'shipped', text: '已出貨' },
                                    { value: 'completed', text: '已完成' },
                                    { value: 'cancelled', text: '已取消' }
                                ];
                                
                                let statusSelectHTML = '<select id="status-update" style="width: 150px; height: 40px; font-size: 15px; padding: 5px;">';
                                statusOptions.forEach(option => {
                                    const selected = order.status === option.value ? 'selected' : '';
                                    statusSelectHTML += `<option value="${option.value}" ${selected}>${option.text}</option>`;
                                });
                                statusSelectHTML += '</select>';
                                
                                const shippingMethodText = order.shipping === 'home' ? '宅配到府' : '超商取貨';
                                const paymentMethodText = order.payment === 'transfer' ? 'ATM轉帳' : '信用卡付款';
                                
                                const detailHTML = `
                                    <div class="order-detail-container">
                                        <div class="order-detail-header">
                                            <div class="header-title-and-actions">
                                                <h3>訂單詳情: ${escapeHtml(order.orderNumber) || '無訂單編號'}</h3>
                                                <div class="order-detail-actions">
                                                    <button id="edit-order-btn" data-id="${orderId}" class="btn btn-primary">
                                                        <i class="fas fa-edit"></i> 編輯訂單
                                                    </button>
                                                    <button id="delete-order-btn" data-id="${orderId}" class="btn btn-danger">
                                                        <i class="fas fa-trash-alt"></i> 刪除訂單
                                                    </button>
                                                </div>
                                            </div>
                                            <div class="order-actions">
                                                <div class="status-update-container">
                                                    <label for="status-update">狀態:</label>
                                                    ${statusSelectHTML}
                                                </div>
                                                <button id="update-status-btn" data-id="${orderId}" class="btn btn-primary">更新狀態</button>
                                            </div>
                                        </div>
                                        
                                        <div class="order-detail-body">
                                            <div class="order-section" id="customer-info-section">
                                                <h4>客戶信息</h4>
                                                <p><strong>姓名:</strong> ${escapeHtml(order.customer?.name) || '未知'}</p>
                                                <p><strong>電話:</strong> ${escapeHtml(order.customer?.phone) || '未知'}</p>
                                                <p><strong>電子郵件:</strong> ${escapeHtml(order.customer?.email) || '未知'}</p>
                                                <p><strong>${order.shipping === 'home' ? '地址' : '7-11門市'}:</strong> ${escapeHtml(order.customer?.address) || '未知'}</p>
                                            </div>
                                            
                                            <div class="order-section">
                                                <h4>訂單信息</h4>
                                                <p><strong>訂單日期:</strong> ${orderDate}</p>
                                                <p><strong>配送方式:</strong> ${shippingMethodText}</p>
                                                <p><strong>付款方式:</strong> ${paymentMethodText}</p>
                                            </div>
                                            
                                            ${notesHTML}
                                            
                                            <div class="order-section">
                                                <h4>商品清單</h4>
                                                ${itemsHTML}
                                            </div>
                                            
                                            <div class="order-summary">
                                                <p><strong>商品小計:</strong> ${order.subtotal || 0}</p>
                                                <p><strong>運費:</strong> ${order.shippingFee || 0}</p>
                                                <p class="order-total"><strong>總計:</strong> ${order.total || 0}</p>
                                            </div>
                                            
                                            <div class="admin-notes-form">
                                                <h4>新增備註 (管理員)</h4>
                                                <textarea id="admin-order-notes" placeholder="添加備註，客戶可以看到..."></textarea>
                                                <button id="update-admin-notes-btn" data-id="${orderId}" class="btn btn-primary">新增備註</button>
                                            </div>
                                        </div>
                                    </div>
                                `;
                                
                                orderDetail.innerHTML = detailHTML;
                                
                                // 添加事件監聽器
                                const editOrderBtn = document.getElementById('edit-order-btn');
                                if (editOrderBtn) {
                                    editOrderBtn.addEventListener('click', function() {
                                        toggleEditMode(orderId, order);
                                    });
                                }
                                
                                const updateStatusBtn = document.getElementById('update-status-btn');
                                if (updateStatusBtn) {
                                    updateStatusBtn.addEventListener('click', function() {
                                        const newStatus = document.getElementById('status-update').value;
                                        updateOrderStatus(orderId, newStatus);
                                    });
                                }
                                
                                const deleteOrderBtn = document.getElementById('delete-order-btn');
                                if (deleteOrderBtn) {
                                    deleteOrderBtn.addEventListener('click', async function() {
                                        const confirmed = await window.AdminCommon.showConfirmDialog(
                                            '確定要刪除此訂單嗎？此操作無法恢復！',
                                            '刪除訂單'
                                        );
                                        if (confirmed) {
                                            deleteOrder(orderId);
                                        }
                                    });
                                }
                                
                                const updateAdminNotesBtn = document.getElementById('update-admin-notes-btn');
                                if (updateAdminNotesBtn) {
                                    updateAdminNotesBtn.addEventListener('click', function() {
                                        const adminNotes = document.getElementById('admin-order-notes').value;
                                        updateOrderNotesAsAdmin(orderId, adminNotes);
                                    });
                                }
                            } else {
                                orderDetail.innerHTML = '<p class="error-message">找不到訂單信息</p>';
                            }
                        })
                        .catch((error) => {
                            console.error('獲取訂單詳情時出錯:', error);
                            orderDetail.innerHTML = '<p class="error-message">獲取訂單詳情時出錯，請稍後再試</p>';
                        });
                }
                
                // 更新訂單狀態
                function updateOrderStatus(orderId, newStatus) {
                    const orderDocRef = window.firebaseServices.doc(window.firebaseServices.db, 'orders', orderId);
                    
                    window.firebaseServices.updateDoc(orderDocRef, {
                        status: newStatus
                    })
                        .then(() => {
                            const orderItem = document.querySelector(`.order-item[data-id="${orderId}"]`);
                            if (orderItem) {
                                const statusElement = orderItem.querySelector('.status-badge');
                                if (statusElement) {
                                    statusElement.classList.remove(
                                        'pending', 'confirmed', 'shipped', 'completed', 'cancelled'
                                    );
                                    
                                    statusElement.classList.add(newStatus);
                                    
                                    let statusText = '';
                                    switch(newStatus) {
                                        case 'pending': statusText = '待處理'; break;
                                        case 'confirmed': statusText = '已確認'; break;
                                        case 'shipped': statusText = '已出貨'; break;
                                        case 'completed': statusText = '已完成'; break;
                                        case 'cancelled': statusText = '已取消'; break;
                                        default: statusText = '待處理';
                                    }
                                    statusElement.textContent = statusText;
                                }
                            }
                            
                            window.AdminCommon.showToast('訂單狀態已更新', 'success');
                        })
                        .catch((error) => {
                            console.error('更新訂單狀態時出錯:', error);
                            window.AdminCommon.showToast('更新訂單狀態時出錯，請稍後再試', 'error');
                        });
                }
                
                // 刪除訂單功能
                function deleteOrder(orderId) {
                    const orderDocRef = window.firebaseServices.doc(window.firebaseServices.db, 'orders', orderId);
                    
                    window.firebaseServices.deleteDoc(orderDocRef)
                        .then(() => {
                            const orderItem = document.querySelector(`.order-item[data-id="${orderId}"]`);
                            if (orderItem) {
                                orderItem.remove();
                            }
                            
                            orderDetail.innerHTML = '<div class="no-order-selected"><p>請選擇一個訂單查看詳情</p></div>';
                            
                            const orderItems = document.querySelectorAll('.order-item');
                            if (orderItems.length === 0) {
                                orderList.innerHTML = '<p class="no-orders">沒有找到訂單</p>';
                            }
                            
                            window.AdminCommon.showToast('訂單已成功刪除', 'success');
                        })
                        .catch((error) => {
                            console.error('刪除訂單時出錯:', error);
                            window.AdminCommon.showToast('刪除訂單時出錯，請稍後再試', 'error');
                        });
                }
                
                // 管理員更新訂單備註
                function updateOrderNotesAsAdmin(orderId, notes) {
                    if (!notes.trim()) {
                        window.AdminCommon.showToast('備註不能為空', 'warning');
                        return;
                    }
                    
                    const orderDocRef = window.firebaseServices.doc(window.firebaseServices.db, 'orders', orderId);
                    
                    window.firebaseServices.getDoc(orderDocRef)
                        .then((docSnap) => {
                            if (docSnap.exists()) {
                                const orderData = docSnap.data();
                                
                                const now = new Date();
                                const timestamp = now.toLocaleString('zh-TW', {
                                    year: 'numeric',
                                    month: '2-digit',
                                    day: '2-digit',
                                    hour: '2-digit',
                                    minute: '2-digit'
                                });
                                
                                const newNoteEntry = `[管理員 ${timestamp}] ${notes}`;
                                
                                const existingNotes = orderData.notes || '';
                                let updatedNotes;
                                
                                if (existingNotes.trim() === '') {
                                    updatedNotes = newNoteEntry;
                                } else {
                                    updatedNotes = existingNotes + '\n' + newNoteEntry;
                                }
                                
                                return window.firebaseServices.updateDoc(orderDocRef, {
                                    notes: updatedNotes
                                });
                            }
                        })
                        .then(() => {
                            document.getElementById('admin-order-notes').value = '';
                            window.AdminCommon.showToast('備註已新增', 'success');
                            showOrderDetail(orderId);
                        })
                        .catch((error) => {
                            console.error('更新訂單備註時出錯:', error);
                            window.AdminCommon.showToast('更新備註時出錯，請稍後再試', 'error');
                        });
                }

                // 切換編輯模式
                function toggleEditMode(orderId, orderData) {
                    const editBtn = document.getElementById('edit-order-btn');
                    
                    if (editBtn.textContent.includes('編輯')) {
                        // 進入編輯模式
                        showEditForm(orderId, orderData);
                        editBtn.innerHTML = '<i class="fas fa-times"></i> 取消編輯';
                        editBtn.className = 'btn btn-secondary';
                    } else {
                        // 取消編輯模式
                        showOrderDetail(orderId);
                    }
                }

                // 顯示編輯表單
                function showEditForm(orderId, orderData) {
                    const customerSection = document.getElementById('customer-info-section');
                    
                    const editFormHTML = `
                        <div class="edit-order-form">
                            <h4>編輯客戶信息</h4>
                            <form id="edit-customer-form">
                                <div class="form-row">
                                    <div class="form-group">
                                        <label for="edit-customer-name">客戶姓名 *</label>
                                        <input type="text" id="edit-customer-name" value="${escapeHtml(orderData.customer?.name)}" required>
                                    </div>
                                    <div class="form-group">
                                        <label for="edit-customer-phone">客戶電話</label>
                                        <input type="tel" id="edit-customer-phone" value="${escapeHtml(orderData.customer?.phone)}">
                                    </div>
                                </div>

                                <div class="form-row">
                                    <div class="form-group">
                                        <label for="edit-customer-email">電子郵件</label>
                                        <input type="email" id="edit-customer-email" value="${escapeHtml(orderData.customer?.email)}">
                                    </div>
                                    <div class="form-group">
                                        <label for="edit-shipping-method">配送方式</label>
                                        <select id="edit-shipping-method">
                                            <option value="store" ${orderData.shipping === 'store' ? 'selected' : ''}>7-11超商取貨</option>
                                            <option value="home" ${orderData.shipping === 'home' ? 'selected' : ''}>宅配到府</option>
                                        </select>
                                    </div>
                                </div>
                                
                                <div class="form-row">
                                    <div class="form-group">
                                        <label for="edit-customer-address" id="address-label">
                                            ${orderData.shipping === 'home' ? '配送地址' : '7-11門市'}
                                        </label>
                                        <input type="text" id="edit-customer-address" value="${escapeHtml(orderData.customer?.address)}">
                                    </div>
                                    <div class="form-group">
                                        <label for="edit-payment-method">付款方式</label>
                                        <select id="edit-payment-method">
                                            <option value="transfer" ${orderData.payment === 'transfer' ? 'selected' : ''}>ATM轉帳</option>
                                            <option value="credit" ${orderData.payment === 'credit' ? 'selected' : ''}>信用卡付款</option>
                                        </select>
                                    </div>
                                </div>
                                
                                <div class="form-row">
                                    <div class="form-group">
                                        <label for="edit-shipping-fee">運費</label>
                                        <input type="number" id="edit-shipping-fee" value="${orderData.shippingFee || 0}" min="0" step="1">
                                    </div>
                                    <div class="form-group">
                                        <label for="edit-order-notes">客戶備註</label>
                                        <input type="text" id="edit-order-notes" value="${escapeHtml(orderData.notes)}">
                                    </div>
                                </div>
                                
                                <div class="edit-form-actions">
                                    <button type="button" id="cancel-edit-btn" class="btn btn-secondary">取消</button>
                                    <button type="submit" class="btn btn-success">
                                        <i class="fas fa-save"></i> 儲存變更
                                    </button>
                                </div>
                            </form>
                        </div>
                    `;
                    
                    customerSection.innerHTML = editFormHTML;
                    
                    // 綁定配送方式變更事件
                    const shippingMethodSelect = document.getElementById('edit-shipping-method');
                    const addressLabel = document.getElementById('address-label');
                    
                    shippingMethodSelect.addEventListener('change', function() {
                        if (this.value === 'home') {
                            addressLabel.textContent = '配送地址';
                        } else {
                            addressLabel.textContent = '7-11門市';
                        }
                    });
                    
                    // 綁定表單提交事件
                    const editForm = document.getElementById('edit-customer-form');
                    editForm.addEventListener('submit', function(e) {
                        e.preventDefault();
                        saveOrderChanges(orderId);
                    });
                    
                    // 綁定取消按鈕
                    const cancelBtn = document.getElementById('cancel-edit-btn');
                    cancelBtn.addEventListener('click', function() {
                        showOrderDetail(orderId);
                    });
                }

                // 儲存訂單變更
                async function saveOrderChanges(orderId) {
                    try {
                        const submitBtn = document.querySelector('#edit-customer-form button[type="submit"]');
                        const originalText = submitBtn.innerHTML;
                        submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 儲存中...';
                        submitBtn.disabled = true;
                        
                        // 獲取表單數據
                        const customerName = document.getElementById('edit-customer-name').value.trim();
                        const customerPhone = document.getElementById('edit-customer-phone').value.trim();
                        const customerEmail = document.getElementById('edit-customer-email').value.trim();
                        const customerAddress = document.getElementById('edit-customer-address').value.trim();
                        const shippingMethod = document.getElementById('edit-shipping-method').value;
                        const paymentMethod = document.getElementById('edit-payment-method').value;
                        const shippingFee = parseInt(document.getElementById('edit-shipping-fee').value) || 0;
                        const orderNotes = document.getElementById('edit-order-notes').value.trim();
                        
                        // 驗證必填欄位
                        if (!customerName) {
                            window.AdminCommon.showToast('客戶姓名為必填欄位', 'error');
                            return;
                        }
                        
                        // 獲取當前訂單數據以計算新的總金額
                        const orderDocRef = window.firebaseServices.doc(window.firebaseServices.db, 'orders', orderId);
                        const docSnap = await window.firebaseServices.getDoc(orderDocRef);
                        
                        if (!docSnap.exists()) {
                            window.AdminCommon.showToast('訂單不存在', 'error');
                            return;
                        }
                        
                        const currentOrderData = docSnap.data();
                        const subtotal = currentOrderData.subtotal || 0;
                        const newTotal = subtotal + shippingFee;
                        
                        // 更新訂單數據
                        const updateData = {
                            customer: {
                                name: customerName,
                                phone: customerPhone,
                                email: customerEmail,
                                address: customerAddress
                            },
                            shipping: shippingMethod,
                            payment: paymentMethod,
                            shippingFee: shippingFee,
                            total: newTotal,
                            notes: orderNotes,
                            lastModified: new Date(),
                            modifiedBy: 'admin'
                        };
                        
                        await window.firebaseServices.updateDoc(orderDocRef, updateData);
                        
                        window.AdminCommon.showToast('訂單信息已成功更新', 'success');
                        
                        // 重新載入訂單詳情
                        showOrderDetail(orderId);
                        
                        // 重新載入訂單列表以反映變更
                        loadOrders();
                        
                    } catch (error) {
                        console.error('更新訂單信息時出錯:', error);
                        window.AdminCommon.showToast('更新訂單信息時出錯：' + error.message, 'error');
                    } finally {
                        const submitBtn = document.querySelector('#edit-customer-form button[type="submit"]');
                        if (submitBtn) {
                            submitBtn.innerHTML = '<i class="fas fa-save"></i> 儲存變更';
                            submitBtn.disabled = false;
                        }
                    }
                }
            }
            
            // 開始初始化流程
            waitForAdminCommon();
        });
    </script>
</body>
</html>
